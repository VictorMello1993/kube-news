services:
# App
 kube_news:
  image: victormello93/kube-news:${KUBE_NEWS_TAG:-latest}
  build: 
    context: ./src
    dockerfile: Dockerfile
  ports:
    - 8080:8080
  networks:
    - kube_news_net
  depends_on:
    - postgre    
  environment:
    DB_PASSWORD: ${POSTGRES_PASSWORD}
    DB_USERNAME: ${POSTGRES_USER}
    DB_DATABASE: ${POSTGRES_DB}
    DB_HOST: postgre #Especificando o nome do container (service) do banco de dados para que conecte na mesma rede