services:
# BD
 postgre:
  image: postgres:${POSTGRES_TAG}
  ports:
   - 5432:5432
  environment:
   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
   POSTGRES_USER: ${POSTGRES_USER}
   POSTGRES_DB: ${POSTGRES_DB}
   
  volumes: 
    - postgres_docker_vol:/var/lib/postgresql/data 
  networks:
    - kube_news_net  

# include:
#   - ./kube-news-app.yml

# app
 kube_news:
  image: victormello93/kube-news:${KUBE_NEWS_TAG:-latest}
  build: 
    context: ./src
    dockerfile: Dockerfile
  ports:
    - 8080:8080
  networks:
    - kube_news_net
  depends_on:
    - postgre    
  environment:
    DB_PASSWORD: ${POSTGRES_PASSWORD}
    DB_USERNAME: ${POSTGRES_USER}
    DB_DATABASE: ${POSTGRES_DB}
    DB_HOST: postgre
  volumes:
    - teste_app_vol:/teste2

volumes:
  postgres_docker_vol:
  teste_app_vol:

networks:
  kube_news_net:
   driver: bridge  